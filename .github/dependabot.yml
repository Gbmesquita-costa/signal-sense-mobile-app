version: 2
updates:
  # npm: majors are ignored. Packages whose versions are tied to the Expo
  # SDK only get patch updates; they move to new minors together with an
  # SDK upgrade (`npx expo install --fix`). Everything else is grouped into
  # one weekly PR.
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-worklets"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-screens"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-svg"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "react-native-web"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@react-native-community/netinfo"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
